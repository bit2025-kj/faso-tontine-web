services:
  - type: web
    name: faso-tontine-web
    runtime: node
    # Not scoped with `rootDir:` — the build command needs both web/ and
    # bff/ as siblings, and bff/dist/main.js locates the built frontend at
    # runtime via a relative ../../web/dist path.
    #
    # `--include=dev` est indispensable : NODE_ENV=production (ci-dessous, requis
    # au runtime) fait normalement sauter les devDependencies à `npm install`,
    # or les outils de build (vite, typescript, @vitejs/plugin-react, @nestjs/cli)
    # y sont — sans ce flag, le build échoue sur "Cannot find module 'vite'".
    buildCommand: cd web && npm install --include=dev && npm run build && cd ../bff && npm install --include=dev && npm run build
    startCommand: cd bff && npm run start:prod
    plan: free

    envVars:
      # The existing FastAPI backend (tontine-backend service) — untouched,
      # called server-to-server from the BFF, never from the browser, so its
      # CORS whitelist (ALLOWED_ORIGINS_CSV) doesn't need this app added.
      - key: FASTAPI_BASE_URL
        value: https://tontine-backend-qoti.onrender.com

      # Signs nothing security-critical today (see auth/auth.controller.ts —
      # the session cookie itself isn't HMAC-signed), kept for any future use
      # of cookie-parser's signing support.
      - key: SESSION_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
